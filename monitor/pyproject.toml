[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "velop-doctor"
version = "0.1.0"
description = "Local debugging dashboard for Linksys Velop mesh networks: node health, backhaul, clients, sync status and history."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jon Rasmussen" }]
keywords = ["linksys", "velop", "mesh", "wifi", "monitoring", "jnap", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.scripts]
velop-doctor = "velop_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
velop_doctor = ["web/*.html"]
